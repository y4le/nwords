[package]
name = "nwords-cli"
description = "Command-line positional ID phrase converter for nwords."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "nwords"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.61", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
nwords = { version = "0.1.0", path = "../nwords", default-features = false, features = ["std", "adjective-animal", "named", "bip39", "positional", "stats", "word-bytes"] }
