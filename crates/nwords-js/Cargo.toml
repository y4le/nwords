[package]
name = "nwords-js"
description = "Bounded named-shape bindings for the nwords JavaScript package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nwords = { version = "0.1.0", path = "../nwords", default-features = false, features = ["alloc", "named", "positional", "stats"] }
wasm-bindgen = "=0.2.120"
