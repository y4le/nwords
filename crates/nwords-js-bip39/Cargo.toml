[package]
name = "nwords-js-bip39"
description = "Minimal English BIP-39 WebAssembly binding for nwords."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nwords = { version = "0.1.0", path = "../nwords", default-features = false, features = ["alloc", "bip39-english"] }
wasm-bindgen = "=0.2.120"
