[package]
name = "nwords"
description = "Bidirectional word and phrase codecs for entropy and IDs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = [
    "std",
    "alloc",
    "adjective-animal",
    "named",
    "eff-long",
    "bip39",
    "positional",
    "stats",
    "word-bytes",
]
std = [
    "alloc",
    "nwords-core/std",
    "nwords-schemes/std",
    "nwords-wordlists?/std",
    "nwords-bip39-seed?/std",
]
alloc = [
    "nwords-core/alloc",
    "nwords-schemes/alloc",
    "nwords-wordlists?/alloc",
    "nwords-bip39-seed?/alloc",
]
stats = ["nwords-core/stats"]
adjective-animal = ["named", "nwords-wordlists/adjective-animal"]
named = ["dep:nwords-wordlists", "nwords-wordlists/named"]
eff-long = ["named", "nwords-wordlists/eff-long"]
bip39 = ["bip39-english"]
bip39-english = [
    "alloc",
    "dep:nwords-wordlists",
    "nwords-schemes/bip39-english",
    "nwords-wordlists/bip39-english",
]
bip39-japanese = [
    "bip39-english",
    "nwords-schemes/bip39-japanese",
    "nwords-wordlists/bip39-japanese",
]
bip39-seed = ["alloc", "dep:nwords-bip39-seed"]
positional = ["alloc", "nwords-schemes/positional"]
word-bytes = ["alloc", "nwords-schemes/word-bytes"]

[dependencies]
nwords-core = { version = "0.1.0", path = "../nwords-core", default-features = false }
nwords-schemes = { version = "0.1.0", path = "../nwords-schemes", default-features = false }
nwords-wordlists = { version = "0.1.0", path = "../nwords-wordlists", default-features = false, optional = true }
nwords-bip39-seed = { version = "0.1.0", path = "../nwords-bip39-seed", default-features = false, optional = true }
