name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - fmt
          - clippy
          - test
          - no-default-alloc
          - docs
          - vectors
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        if: matrix.check == 'fmt'
        run: cargo fmt --check
      - name: cargo clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        if: matrix.check == 'test'
        run: cargo test --workspace --all-features
      - name: no-default alloc check
        if: matrix.check == 'no-default-alloc'
        run: |
          cargo check -p nwords --no-default-features --features alloc
          cargo test -p nwords --no-default-features --features "alloc stats bip39"
      - name: cargo doc
        if: matrix.check == 'docs'
        run: cargo doc --workspace --all-features --no-deps
      - name: vector checksums
        if: matrix.check == 'vectors'
        run: sha256sum -c tests/vectors/SHA256SUMS
